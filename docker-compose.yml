services:
  wal-kv-store:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wal-kv-store
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - WAL_FILE=/data/wal/store.wal
      - WAL_AUTO_COMPACT_THRESHOLD_BYTES=10485760 # 10 MB auto-compaction
    volumes:
      - wal-data:/data/wal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          memory: 256M

volumes:
  wal-data:
    driver: local
